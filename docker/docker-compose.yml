name: suitora

services:
  web:
    build:
      # The Dockerfile lives in ./docker but scans the repo root for source,
      # so the build context is the project root.
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-0123456789}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:./data/suitora.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    depends_on:
      - redis
    restart: always

  # Background worker: subscribes to the `trend-sync` channel and invalidates
  # the dashboard cache when a sync completes (see services/worker/index.ts).
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-0123456789}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:./data/suitora.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # Reverse proxy / load balancer. Run `docker compose up --scale web=3` to
  # horizontally scale web replicas behind a single entrypoint.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always