name: suitora

services:
  web:
    build:
      # The Dockerfile lives in ./docker but scans the repo root for source,
      # so the build context is the project root.
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-0123456789}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:./data/suitora.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    depends_on:
      - redis
    restart: always

  # Background worker: subscribes to the `trend-sync` channel and invalidates
  # the dashboard cache when a sync completes (see services/worker/index.ts).
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-0123456789}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:./data/suitora.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # Observability stack (Pillar 04, Action Items 6 & 7).
  # Prometheus scrapes the web tier on the internal network; Grafana is the
  # visualization layer; Alertmanager fans alerts out to on-call channels.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - web
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/data
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - prometheus
    restart: always

  # Reverse proxy / load balancer. Run `docker compose up --scale web=3` to
  # horizontally scale web replicas behind a single entrypoint.
  # Drop your Let's Encrypt/Cloudflare certs (fullchain.pem, privkey.pem) into
  # ./certs/ (gitignored) and update the server_name in nginx/nginx.conf.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: always

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data: