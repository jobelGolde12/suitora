# Nginx reverse proxy / load balancer for Suitora.
#
# Horizontal scaling: with Docker Compose run the web tier with multiple
# replicas (e.g. `docker compose up --scale web=3`) — nginx load-balances
# across all of them via least-conn. Equivalent to the Kubernetes Ingress in
# /k8s/ingress.yaml.
#
# TLS: mount your Let's Encrypt / Cloudflare certificate chain + key at
# /etc/nginx/certs (see docker/docker-compose.yml). Provide the domain via the
# SERVER_NAME environment variable. All HTTP traffic is redirected to HTTPS and
# only TLS 1.2/1.3 are enabled.

events {
  worker_connections 1024;
}

http {
  upstream suitora_web {
    # Distribute across web replicas; prefer the least-busy connection.
    least_conn;
    server web:3000;
  }

  # Redirect all HTTP → HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    # Replace with your public domain (e.g. suitora.example.com).
    server_name suitora.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Reject requests that present a Host header not matching this server name.
    if ($host != "suitora.example.com") {
      return 421;
    }

    # Well-known immutable Next.js build assets — cache long-term at the edge.
    location /_next/static/ {
      proxy_pass http://suitora_web;
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_cache_valid 200 31536000;
    }

    # Never expose Prometheus metrics to the public internet. Prometheus scrapes
    # the web tier directly over the internal Docker network (web:3000/metrics),
    # so nginx returns 403 for any external request.
    location = /metrics {
      return 403;
    }

    # Liveness/health probes are deliberately public so load balancers and the
    # synthetic health-check cron (see jobs/health-check.ts) can reach them.
    location = /api/health {
      proxy_pass http://suitora_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    location / {
      proxy_pass http://suitora_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;
}

