# Nginx reverse proxy / load balancer for Suitora.
#
# Horizontal scaling: with Docker Compose run the web tier with multiple
# replicas (e.g. `docker compose up --scale web=3`) — nginx load-balances
# across all of them via least-conn. Equivalent to the Kubernetes Ingress in
# /k8s/ingress.yaml.
events {
  worker_connections 1024;
}

http {
  upstream suitora_web {
    # Distribute across web replicas; prefer the least-busy connection.
    least_conn;
    server web:3000;
  }

  server {
    listen 80;

    # Well-known immutable Next.js build assets — cache long-term at the edge.
    location /_next/static/ {
      proxy_pass http://suitora_web;
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_cache_valid 200 31536000;
    }

    location / {
      proxy_pass http://suitora_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;
}
