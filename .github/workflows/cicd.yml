# CI/CD Pipeline: quality gate → image build/push → staging → blue-green prod.
#
# This file was rebuilt 2026-08-11 to replace a corrupted (prose) version. It
# intentionally duplicates the essential quality gate from `ci.yml` so a deploy
# can never proceed on a weaker check, and it keeps image builds self-contained
# (same tags as `.github/workflows/docker.yml`) so kubectl only ever runs after
# a successful push.
#
# Required secrets:
#   KUBE_CONFIG_DATA (or KUBE_CONFIG_DATA_STAGING / KUBE_CONFIG_DATA_PROD) —
#     base64-encoded kubeconfig for the target cluster.
#   SLACK_WEBHOOK_URL (and SLACK_WEBHOOK_URL_PROD) — Slack incoming webhooks.
#   Staging runtime secrets (BETTER_AUTH_SECRET, TURSO_*, UPSTASH_*, …) —
#     injected by the guarded `kubectl set env` step.
#
# See project-plan/07-implementation-roadmap.md Phase B and
# project-plan/08-devops-and-deployment.md.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: "Image tag to deploy (or restore on rollback)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/suitora
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/suitora-worker

jobs:
  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every workflow is a structured mapping with a jobs key
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path) as f:
                  doc = yaml.safe_load(f)
              if not isinstance(doc, dict):
                  bad.append(f"{path}: not a YAML mapping")
              elif not isinstance(doc.get("jobs"), dict):
                  bad.append(f"{path}: missing a jobs mapping")
          if bad:
              sys.stderr.write("\n".join(bad) + "\n")
              sys.exit(1)
          print("All workflow files OK")
          PY
          else
            echo "PyYAML not available; falling back to Ruby"
            ruby -ryaml -e '
          Dir.glob(".github/workflows/*.yml").sort.each do |path|
            doc = YAML.load_file(path)
            abort("#{path}: not a YAML mapping") unless doc.is_a?(Hash)
            abort("#{path}: missing a jobs mapping") unless doc["jobs"].is_a?(Hash)
          end
          puts "All workflow files OK"
          '
          fi

      - name: Shell syntax check
        run: bash -n scripts/rollback.sh

  build-and-test:
    name: Lint, typecheck, test (coverage-gated), build
    runs-on: ubuntu-latest
    needs: validate-workflows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: "ci-only-placeholder-secret-0123456789abcdef"
          TURSO_DATABASE_URL: "file:./data/suitora.db"

  staging-deploy:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA_STAGING || secrets.KUBE_CONFIG_DATA }}

      - name: Deploy web + worker to staging
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml -n staging
          kubectl set image deployment/suitora-web web=${{ env.IMAGE }}:${{ github.sha }} -n staging
          kubectl apply -f k8s/worker-deployment.yaml -n staging
          kubectl set image deployment/suitora-worker worker=${{ env.IMAGE_WORKER }}:${{ github.sha }} -n staging
          kubectl rollout status deployment/suitora-web -n staging --timeout=300s
          kubectl rollout status deployment/suitora-worker -n staging --timeout=300s

      - name: Inject staging runtime env (guarded)
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          for spec in \
            "suitora-web:BETTER_AUTH_SECRET" \
            "suitora-web:TURSO_DATABASE_URL" \
            "suitora-web:TURSO_AUTH_TOKEN" \
            "suitora-worker:UPSTASH_REDIS_REST_URL" \
            "suitora-worker:UPSTASH_REDIS_REST_TOKEN" \
            ; do
            dep="${spec%%:*}"
            var="${spec##*:}"
            value="${!var:-}"
            if [ -n "$value" ]; then
              kubectl set env "deployment/${dep}" -n staging "${var}=${value}"
            fi
          done

      - name: Smoke check
        run: |
          kubectl get pods -n staging -l tier=frontend -o wide

      - name: Notify Slack (staging)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL configured; skipping notification"
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Suitora staging deploy: ${{ job.status }} (${{ github.sha }}) — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

  production-deploy:
    name: Blue-green deploy to production
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'deploy')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.version || github.sha) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA_PROD || secrets.KUBE_CONFIG_DATA }}

      - name: Determine active / standby environment
        id: bluegreen
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          ACTIVE=$(kubectl get configmap blue-green-active -n production -o jsonpath='{.data.ACTIVE_ENV}' 2>/dev/null || echo blue)
          if [ "$ACTIVE" = "blue" ]; then STANDBY=green; else STANDBY=blue; fi
          echo "active=${ACTIVE}" >> "$GITHUB_OUTPUT"
          echo "standby=${STANDBY}" >> "$GITHUB_OUTPUT"
          echo "Deploying to standby environment: ${STANDBY}"

      - name: Deploy standby and wait for rollout
        run: |
          kubectl apply -f k8s/deployment-${{ steps.bluegreen.outputs.standby }}.yaml -n production
          kubectl set image deployment/suitora-web-${{ steps.bluegreen.outputs.standby }} \
            web=${{ env.IMAGE }}:${{ env.IMAGE_TAG }} -n production --record
          kubectl rollout status deployment/suitora-web-${{ steps.bluegreen.outputs.standby }} \
            -n production --timeout=300s

      - name: Health gate on standby pods
        run: |
          kubectl get pods -n production -l version=${{ steps.bluegreen.outputs.standby }} -o wide

      - name: Cut over traffic to standby
        run: |
          STANDBY=${{ steps.bluegreen.outputs.standby }}
          kubectl patch service suitora-web -n production -p \
            "{\"spec\":{\"selector\":{\"app\":\"suitora\",\"tier\":\"frontend\",\"version\":\"${STANDBY}\"}}}"
          kubectl apply -f k8s/worker-deployment.yaml -n production
          kubectl set image deployment/suitora-worker worker=${{ env.IMAGE_WORKER }}:${{ env.IMAGE_TAG }} \
            -n production --record
          kubectl rollout status deployment/suitora-worker -n production --timeout=300s

      - name: Flip active-environment marker
        run: |
          kubectl create configmap blue-green-active -n production \
            --from-literal=ACTIVE_ENV=${{ steps.bluegreen.outputs.standby }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Notify Slack (production)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_PROD || secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No production Slack webhook configured; skipping notification"
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Suitora production deploy: ${{ job.status }} (${{ env.IMAGE_TAG }}) — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

  rollback:
    name: Rollback production deployment
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'rollback'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.inputs.version || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA_PROD || secrets.KUBE_CONFIG_DATA }}

      - name: Flip service + configmap back to the previous environment
        run: |
          ACTIVE=$(kubectl get configmap blue-green-active -n production -o jsonpath='{.data.ACTIVE_ENV}' 2>/dev/null || echo blue)
          if [ "$ACTIVE" = "blue" ]; then PREVIOUS=green; else PREVIOUS=blue; fi
          echo "Rolling back to previous environment: ${PREVIOUS}"
          kubectl set image deployment/suitora-web-${PREVIOUS} \
            web=${{ env.IMAGE }}:${{ env.IMAGE_TAG }} -n production --record || true
          kubectl rollout status deployment/suitora-web-${PREVIOUS} -n production --timeout=300s || true
          kubectl patch service suitora-web -n production -p \
            "{\"spec\":{\"selector\":{\"app\":\"suitora\",\"tier\":\"frontend\",\"version\":\"${PREVIOUS}\"}}}"
          kubectl create configmap blue-green-active -n production \
            --from-literal=ACTIVE_ENV=${PREVIOUS} \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Rollback to ${PREVIOUS} complete"

      - name: Notify Slack (rollback)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_PROD || secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No production Slack webhook configured; skipping notification"
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Suitora production rollback: ${{ job.status }} (${{ env.IMAGE_TAG }}) — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
