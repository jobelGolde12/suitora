name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the e2e job be triggered on demand against any branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      - name: Migrations against a fresh DB (schema parity)
        continue-on-error: true
        run: |
          npm run db:migrate
          npm run db:status
        env:
          TURSO_DATABASE_URL: "file:/tmp/ci-migrate.db"

      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: "ci-only-placeholder-secret-0123456789abcdef"
          TURSO_DATABASE_URL: "file:./data/suitora.db"

  # Self-contained Cypress run (S-02). Replaces the previous e2e step inside
  # `verify`, which ran `npm run test:e2e` without booting a server and so
  # could never pass on its own. This job boots the app against a migrated
  # e2e database, waits for /api/health, and runs the full suite (including
  # the axe-core accessibility spec) headless in system Chrome.
  e2e:
    name: E2E (Cypress)
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate the E2E database
        run: node scripts/migrate.mjs
        env:
          TURSO_DATABASE_URL: "file:./data/e2e-test.db"

      - name: Start the dev server
        env:
          BETTER_AUTH_SECRET: "ci-e2e-secret-0123456789abcdef"
          BETTER_AUTH_URL: "http://localhost:3000"
          TURSO_DATABASE_URL: "file:./data/e2e-test.db"
          TRYON_PROVIDER: "mock"
        run: |
          npm run dev > /tmp/suitora-dev.log 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"
          # Cold Turbopack compiles are slow; allow up to ~3 minutes.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Dev server ready after ~$((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Dev server did not become ready" >&2
          tail -100 /tmp/suitora-dev.log >&2
          exit 1

      - name: Run E2E suite (Cypress, Chrome headless)
        run: npm run test:e2e:ci

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: ignore

      - name: Stop the dev server
        if: always()
        run: kill "${DEV_PID:-0}" 2>/dev/null || pkill -f "next dev" 2>/dev/null || true

