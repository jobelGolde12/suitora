apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitora-web
  labels:
    app: suitora
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: suitora
      tier: frontend
  template:
    metadata:
      labels:
        app: suitora
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/jobelGolde12/suitora:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_BASE
              value: "/api"
            - name: REDIS_URL
              value: "redis://redis:6379"
          readinessProbe:
            httpGet:
              path: /api/trending
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/trending
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
--- 
apiVersion: v1
kind: Service
metadata:
  name: suitora-web
  labels:
    app: suitora
    tier: frontend
spec:
  selector:
    app: suitora
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: suitora-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: suitora-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70